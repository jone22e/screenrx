# Packaging of the desktop app. The app is built first by electron-vite into out/; this only assembles
# and signs the bundle.
#   npm run dist          local installer, ad-hoc signed, nothing published
#   npm run release:mac   Developer ID signed, notarized, uploaded to the release page (`make update`)
appId: com.screenrx.app
productName: ScreenRx
copyright: Copyright © 2026 Jone

directories:
  output: release
  buildResources: build

# The bundles in out/ already contain everything they import, except the two
# packages that carry executables.
files:
  - out/**
  - package.json
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/scheduler/**"

# Executables cannot run from inside the archive.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/@ffprobe-installer/**

mac:
  category: public.app-category.video
  icon: build/icon.icns
  # The dmg is for the first installation; the zip is what the running app downloads to update itself.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  minimumSystemVersion: "14.0"
  # An update replaces the app only if it carries the same signature as the installed one.
  identity: "C2S Business Ltda (3UG973ND38)"
  notarize: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The native helpers (capture, transcription, voice), where the main process looks for them.
  # The voice helper comes with MLX's compiled shader library, which it loads from beside itself.
  extraResources:
    - from: dist-native/darwin
      to: native
  binaries:
    - Contents/Resources/native/screenrx-capture
    - Contents/Resources/native/screenrx-transcribe
    - Contents/Resources/native/screenrx-dub
  extendInfo:
    NSMicrophoneUsageDescription: O ScreenRx grava o microfone junto com a tela quando você o ativa na barra de gravação.
    NSCameraUsageDescription: O ScreenRx grava a câmera junto com a tela quando você a ativa na barra de gravação.
    NSSpeechRecognitionUsageDescription: O ScreenRx transcreve a fala das gravações, neste Mac, para gerar legendas.
    NSAudioCaptureUsageDescription: O ScreenRx grava o áudio do sistema junto com a tela quando você o ativa.

dmg:
  title: ScreenRx ${version}
  artifactName: ScreenRx-${version}-${arch}.dmg

# Where the installed app looks for newer versions (the release page), and where `release:mac` uploads
# them. A plain build uploads nothing.
publish:
  provider: github
  owner: jone22e
  repo: screenrx
